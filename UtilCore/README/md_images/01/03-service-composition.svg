<svg xmlns='http://www.w3.org/2000/svg' width='760' height='616' font-family="'Noto Sans CJK KR','Noto Sans CJK SC','Malgun Gothic',sans-serif" viewBox='0 0 760 616' role='img' font-size='13'><rect width='100%' height='100%' fill='#ffffff'/><defs><marker id='cls-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker></defs><text x='24' y='28' font-size='15' font-weight='600' fill='#1f2937'>서비스가 코어·워커·리스너·세션 매니저를 조립한다</text><text x='24' y='48' font-size='11.5' fill='#4b5563'>점선 = 상속, 실선 = 소유·호출. 서버·클라이언트 서비스는 같은 CIocpCore를 공유한다.</text><g><path d='M252 184V160H380V136' fill='none' stroke='#6b7280' stroke-width='1.25' stroke-dasharray='5 4' marker-end='url(#cls-arrow)'/><path d='M628 184V160H380' fill='none' stroke='#6b7280' stroke-width='1.25' stroke-dasharray='5 4'/><path d='M252 272V300H132V344' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M252 272V300H380V344' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M252 272V300H628V344' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M628 272V344' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M132 432V548H272' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M628 432V548H488' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/></g><text x='388' y='152' font-size='11.5' text-anchor='start' fill='#4b5563'>상속</text><text x='140' y='292' font-size='11.5' text-anchor='start' fill='#4b5563'>소유</text><text x='140' y='486' font-size='11.5' text-anchor='start' fill='#4b5563'>Register (소켓 등록)</text><text x='620' y='486' font-size='11.5' text-anchor='end' fill='#4b5563'>DispatchBatch 반복</text><g><rect x='272' y='72' width='216' height='64' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='28