<svg xmlns='http://www.w3.org/2000/svg' width='760' height='616' font-family="'Noto Sans CJK KR','Noto Sans CJK SC','Malgun Gothic',sans-serif" viewBox='0 0 760 616' role='img' font-size='13'><rect width='100%' height='100%' fill='#ffffff'/><defs><marker id='cls-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker></defs><text x='24' y='28' font-size='15' font-weight='600' fill='#1f2937'>세션은 링버퍼·이벤트·송신 버퍼를 소유하고 CIocpObject로 코어에 등록된다</text><text x='24' y='48' font-size='11.5' fill='#4b5563'>점선 = 상속, 실선 = 소유·생성.</text><g><path d='M132 192V144' fill='none' stroke='#6b7280' stroke-width='1.25' stroke-dasharray='5 4' marker-end='url(#cls-arrow)'/><path d='M380 192V144' fill='none' stroke='#6b7280' stroke-width='1.25' stroke-dasharray='5 4' marker-end='url(#cls-arrow)'/><path d='M560 192V168H440V144' fill='none' stroke='#6b7280' stroke-width='1.25' stroke-dasharray='5 4' marker-end='url(#cls-arrow)'/><path d='M520 108H488' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M132 296V344' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M380 296V344' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M628 296V344' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M520 388H488' fill='none' stroke='#6b7280' stroke-width='1.25' stroke-dasharray='5 4' marker-end='url(#cls-arrow)'/><path d='M380 432V496' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M240 540H272' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M488 540H520' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/></g><text x='140' y='172' font-size='11.5' text-anchor='start' fill='#4b5563'>상속</text><text x='388' y='172' font-size='11.5' text-anchor='start' fill='#4b5563'>상속</text><text x='476' y='160' font-size='11.5' text-anchor='start' fill='#4b5563'>상속</text><text x='140' y='324' font-size='11.5' text-anchor='start' fill='#4b5563'>소유</text><text x='388' y='324' font-size='11.5' text-anchor='start' fill='#4b5563'>소유 (4종)</text><text x='636' y='324' font-size='11.5' text-anchor='start' fill='#4b5563'>소유 (풀)</text><text x='388' y='472' font-size='11.5' text-anchor='start' fill='#4b5563'>sendBuffers 보유</text><g><rect x='24' y='72' width='216' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='36' y='96' font-size='13' font-weight='600' fill='#1f2937'>CSession (추상)</text><text x='36' y='112' font-size='11.5' fill='#1f2937'>Disconnect · IsConnected</text><text x='36' y='128' font-size='11.5' fill='#1f2937'>Send · SetDisconnectHandler</text></g><g><rect x='272' y='72' width='216' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='284' y='96' font-size='13' font-weight='600' fill='#1f2937'>CIocpObject (인터페이스)</text><text x='284' y='112' font-size='11.5' fill='#1f2937'>GetHandle · Dispatch</text><text x='284' y='128' font-size='11.5' fill='#1f2937'>GetIocpObjectPtr</text></g><g><rect x='520' y='72' width='216' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='532' y='96' font-size='13' font-weight='600' fill='#1f2937'>CIocpCore</text><text x='532' y='112' font-size='11.5' fill='#1f2937'>완료 통지마다</text><text x='532' y='128' font-size='11.5' fill='#1f2937'>owner의 Dispatch() 호출</text></g><g><rect x='24' y='192' width='464' height='104' rx='8' fill='#2563eb' fill-opacity='0.12' stroke='#2563eb' stroke-width='2'/><text x='36' y='216' font-size='13' font-weight='600' fill='#1f2937'>CIocpSession</text><text x='36' y='232' font-size='11.5' fill='#1f2937'>CSession + CIocpObject 다중 상속</text><text x='36' y='248' font-size='11.5' fill='#1f2937'>WSARecv 1개 + WSASend 1개만 동시 진행</text><text x='36' y='264' font-size='11.5' fill='#1f2937'>_pendingIoCount로 완료 대기 수 추적</text><text x='36' y='280' font-size='11.5' fill='#1f2937'>종료 상태 머신 → OnDisconnected 정확히 1회</text></g><g><rect x='520' y='192' width='216' height='104' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='532' y='216' font-size='13' font-weight='600' fill='#1f2937'>CIocpListener</text><text x='532' y='232' font-size='11.5' fill='#1f2937'>CIocpObject 구현</text><text x='532' y='248' font-size='11.5' fill='#1f2937'>AcceptEvent 풀 보유</text><text x='532' y='264' font-size='11.5' fill='#1f2937'>세션 팩터리로 세션 선생성</text><text x='532' y='280' font-size='11.5' fill='#1f2937'>실패 시 지수 백오프 재시도</text></g><g><rect x='24' y='344' width='216' height='88' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='36' y='368' font-size='13' font-weight='600' fill='#1f2937'>CRingBuffer</text><text x='36' y='384' font-size='11.5' fill='#1f2937'>수신 링버퍼 (기본 10KB)</text><text x='36' y='400' font-size='11.5' fill='#1f2937'>GetWSARecvBuffers → WSABUF 2개</text><text x='36' y='416' font-size='11.5' fill='#1f2937'>MoveWrite/MoveRead로 커서 이동</text></g><g><rect x='272' y='344' width='216' height='88' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='284' y='368' font-size='13' font-weight='600' fill='#1f2937'>CIocpEvent : OVERLAPPED</text><text x='284' y='384' font-size='11.5' fill='#1f2937'>RecvEvent · SendEvent</text><text x='284' y='400' font-size='11.5' fill='#1f2937'>DisconnectEvent · ConnectEvent</text><text x='284' y='416' font-size='11.5' fill='#1f2937'>owner = 완료 때까지 객체 유지</text></g><g><rect x='520' y='344' width='216' height='88' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='532' y='368' font-size='13' font-weight='600' fill='#1f2937'>AcceptEvent</text><text x='532' y='384' font-size='11.5' fill='#1f2937'>acceptBuffer · session</text><text x='532' y='400' font-size='11.5' fill='#1f2937'>retryCount (백오프 계산)</text><text x='532' y='416' font-size='11.5' fill='#1f2937'>AcceptEx 완료 통지용</text></g><g><rect x='24' y='496' width='216' height='88' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='36' y='520' font-size='13' font-weight='600' fill='#1f2937'>CSendBufferManager</text><text x='36' y='536' font-size='11.5' fill='#1f2937'>Open(size) → CSendBuffer</text><text x='36' y='552' font-size='11.5' fill='#1f2937'>thread_local 청크에서 할당</text></g><g><rect x='272' y='496' width='216' height='88' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='284' y='520' font-size='13' font-weight='600' fill='#1f2937'>CSendBuffer</text><text x='284' y='536' font-size='11.5' fill='#1f2937'>청크 안의 한 조각</text><text x='284' y='552' font-size='11.5' fill='#1f2937'>Buffer · WriteSize · Close</text></g><g><rect x='520' y='496' width='216' height='88' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='532' y='520' font-size='13' font-weight='600' fill='#1f2937'>CSendBufferChunk</text><text x='532' y='536' font-size='11.5' fill='#1f2937'>8KB 고정 배열</text><text x='532' y='552' font-size='11.5' fill='#1f2937'>Open/Close로 구간 할당</text></g></svg>