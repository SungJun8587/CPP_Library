<svg xmlns='http://www.w3.org/2000/svg' width='760' height='568' font-family="'Noto Sans CJK KR','Noto Sans CJK SC','Malgun Gothic',sans-serif" viewBox='0 0 760 568' role='img' font-size='13'><rect width='100%' height='100%' fill='#ffffff'/><defs><marker id='cls-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker></defs><text x='24' y='28' font-size='15' font-weight='600' fill='#1f2937'>종료는 세 조건이 만족될 때 정확히 한 번 통지된다</text><text x='24' y='48' font-size='11.5' fill='#4b5563'>Disconnect가 시작점이고, 마지막으로 도착한 완료 통지가 통지를 실행한다.</text><g><path d='M240 108H272' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M488 108H520' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M628 144V208' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M132 280V308H340V336' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M628 280V308H420V336' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M380 424V472' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/></g><text x='636' y='182' font-size='11.5' text-anchor='start' fill='#4b5563'>완료 통지</text><text x='388' y='452' font-size='11.5' text-anchor='start' fill='#4b5563'>세 조건이 모두 참일 때</text><g><rect x='24' y='72' width='216' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='36' y='96' font-size='13' font-weight='600' fill='#1f2937'>종료 트리거</text><text x='36' y='112' font-size='11.5' fill='#1f2937'>RemoteClosed · SocketError</text><text x='36' y='128' font-size='11.5' fill='#1f2937'>오버플로우 · ForcedClose</text></g><g><rect x='272' y='72' width='216' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='284' y='96' font-size='13' font-weight='600' fill='#1f2937'>Disconnect(reason)</text><text x='284' y='112' font-size='11.5' fill='#1f2937'>_connected true → false</text><text x='284' y='128' font-size='11.5' fill='#1f2937'>종료 사유 기록 (1회만 성공)</text></g><g><rect x='520' y='72' width='216' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='532' y='96' font-size='13' font-weight='600' fill='#1f2937'>RegisterDisconnect</text><text x='532' y='112' font-size='11.5' fill='#1f2937'>DisconnectEx 요청</text><text x='532' y='128' font-size='11.5' fill='#1f2937'>owner로 수명 유지</text></g><g><rect x='24' y='208' width='216' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='36' y='232' font-size='13' font-weight='600' fill='#1f2937'>ReleaseIo</text><text x='36' y='248' font-size='11.5' fill='#1f2937'>Recv/Send 완료마다(취소 포함)</text><text x='36' y='264' font-size='11.5' fill='#1f2937'>_pendingIoCount 1 감소</text></g><g><rect x='520' y='208' width='216' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='532' y='232' font-size='13' font-weight='600' fill='#1f2937'>ProcessDisconnect</text><text x='532' y='248' font-size='11.5' fill='#1f2937'>DisconnectEx 완료 통지</text><text x='532' y='264' font-size='11.5' fill='#1f2937'>_disconnectCompleted = true</text></g><g><rect x='272' y='336' width='216' height='88' rx='8' fill='#2563eb' fill-opacity='0.12' stroke='#2563eb' stroke-width='2'/><text x='284' y='360' font-size='13' font-weight='600' fill='#1f2937'>TryFinalizeDisconnect</text><text x='284' y='376' font-size='11.5' fill='#1f2937'>DisconnectEx 완료됨</text><text x='284' y='392' font-size='11.5' fill='#1f2937'>_pendingIoCount == 0</text><text x='284' y='408' font-size='11.5' fill='#1f2937'>아직 통지 안 함 (CAS 1회)</text></g><g><rect x='148' y='472' width='464' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='160' y='496' font-size='13' font-weight='600' fill='#1f2937'>OnDisconnected 통지</text><text x='160' y='512' font-size='11.5' fill='#1f2937'>OnDisconnected() 훅 → CSession::OnDisconnected()</text><text x='160' y='528' font-size='11.5' fill='#1f2937'>→ 서비스의 해제 핸들러 → ReleaseSession</text></g></svg>