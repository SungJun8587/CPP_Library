<svg xmlns='http://www.w3.org/2000/svg' width='760' height='632' font-family="'Noto Sans CJK KR','Noto Sans CJK SC','Malgun Gothic',sans-serif" viewBox='0 0 760 632' role='img' aria-label='엔진 선택과 공통 기반 클래스' font-size='13'><rect width='100%' height='100%' fill='#ffffff'/><defs><marker id='cls-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker></defs><text data-claude-text-id='title' x='24' y='28' font-size='15' font-weight='600' fill='#1f2937'>엔진은 팩토리에서 고르고, 소켓·주소·패킷 규칙은 공통으로 쓴다</text><text data-claude-text-id='key' x='24' y='48' font-size='11.5' fill='#4b5563'>점선 = 상속, 실선 = 생성·사용. 서비스는 어느 엔진이든 CNetService로 다룬다.</text><g data-claude-anchor='edges'><path d='M272 116H132V232' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M488 116H628V232' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M240 276H272' fill='none' stroke='#6b7280' stroke-width='1.25' stroke-dasharray='5 4' marker-end='url(#cls-arrow)'/><path d='M520 276H488' fill='none' stroke='#6b7280' stroke-width='1.25' stroke-dasharray='5 4' marker-end='url(#cls-arrow)'/><path d='M132 320V392' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M380 320V392' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/><path d='M628 552V480' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#cls-arrow)'/></g><text x='140' y='200' font-size='11.5' text-anchor='start' fill='#4b5563'>생성</text><text x='636' y='200' font-size='11.5' text-anchor='start' fill='#4b5563'>생성</text><text x='256' y='224' font-size='11.5' text-anchor='middle' fill='#4b5563'>상속</text><text x='140' y='364' font-size='11.5' text-anchor='start' fill='#4b5563'>사용</text><text x='388' y='364' font-size='11.5' text-anchor='start' fill='#4b5563'>주소 보유</text><text x='636' y='520' font-size='11.5' text-anchor='start' fill='#4b5563'>분배 사용</text><g><rect x='272' y='72' width='216' height='88' rx='8' fill='#2563eb' fill-opacity='0.12' stroke='#2563eb' stroke-width='2'/><text x='284' y='96' font-size='13' font-weight='600' fill='#1f2937'>CNetworkFactory</text><text x='284' y='112' font-size='11.5' fill='#1f2937'>EngineCoreRef(variant)로 엔진 결정</text><text x='284' y='128' font-size='11.5' fill='#1f2937'>CreateServerService</text><text x='284' y='144' font-size='11.5' fill='#1f2937'>CreateClientService</text></g><g><rect x='24' y='232' width='216' height='88' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='36' y='256' font-size='13' font-weight='600' fill='#1f2937'>IOCP 서비스</text><text x='36' y='272' font-size='11.5' fill='#1f2937'>CIocpServerService</text><text x='36' y='288' font-size='11.5' fill='#1f2937'>CIocpClientService</text><text x='36' y='304' font-size='11.5' fill='#1f2937'>USE_NETWORK_IOCP 빌드</text></g><g><rect x='272' y='232' width='216' height='88' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='284' y='256' font-size='13' font-weight='600' fill='#1f2937'>CNetService (추상)</text><text x='284' y='272' font-size='11.5' fill='#1f2937'>세션 목록 · 종료 대기</text><text x='284' y='288' font-size='11.5' fill='#1f2937'>CNetServiceRef로 반환</text></g><g><rect x='520' y='232' width='216' height='88' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='532' y='256' font-size='13' font-weight='600' fill='#1f2937'>RIO 서비스</text><text x='532' y='272' font-size='11.5' fill='#1f2937'>CRioServerService</text><text x='532' y='288' font-size='11.5' fill='#1f2937'>CRioClientService</text><text x='532' y='304' font-size='11.5' fill='#1f2937'>USE_NETWORK_RIO 빌드</text></g><g><rect x='24' y='392' width='216' height='88' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='36' y='416' font-size='13' font-weight='600' fill='#1f2937'>CSocketUtils</text><text x='36' y='432' font-size='11.5' fill='#1f2937'>소켓 생성 · 옵션 · Bind</text><text x='36' y='448' font-size='11.5' fill='#1f2937'>AcceptEx·ConnectEx 로드</text><text x='36' y='464' font-size='11.5' fill='#1f2937'>Winsock 에러 메시지</text></g><g><rect x='272' y='392' width='216' height='88' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='284' y='416' font-size='13' font-weight='600' fill='#1f2937'>CNetAddress</text><text x='284' y='432' font-size='11.5' fill='#1f2937'>IPv4 SOCKADDR_IN 래퍼</text><text x='284' y='448' font-size='11.5' fill='#1f2937'>IP 문자열 파싱 검증</text><text x='284' y='464' font-size='11.5' fill='#1f2937'>무효 주소는 Bind 거부</text></g><g><rect x='520' y='392' width='216' height='88' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='532' y='416' font-size='13' font-weight='600' fill='#1f2937'>Packet · Dispatcher</text><text x='532' y='432' font-size='11.5' fill='#1f2937'>PacketHeader(size, type)</text><text x='532' y='448' font-size='11.5' fill='#1f2937'>CPacketDispatcher</text><text x='532' y='464' font-size='11.5' fill='#1f2937'>타입 → 핸들러 분배</text></g><g><rect x='24' y='552' width='712' height='56' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='36' y='576' font-size='13' font-weight='600' fill='#1f2937'>콘텐츠 서버</text><text x='36' y='592' font-size='11.5' fill='#1f2937'>세션 상속(OnRecv 등) · REGISTER_PACKET_HANDLER로 핸들러 등록</text></g></svg>