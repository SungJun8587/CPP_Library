<svg xmlns="http://www.w3.org/2000/svg" width="760" height="284" font-family="Noto Sans CJK KR, sans-serif" viewBox="0 0 760 284" role="img" aria-label="CPU는 가져오기, 해석, 실행, 기록을 반복하고 매 사이클 끝에서 인터럽트를 확인합니다" font-size="13"><defs><marker id="cpu-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F8D84"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1F1E1D">CPU는 네 단계를 쉬지 않고 반복하고, 매 사이클 끝에서 인터럽트를 확인합니다</text><g fill="none" stroke="#8F8D84" stroke-width="1.25"><path d="M176 112H206" marker-end="url(#cpu-arrow)"></path><path d="M358 112H388" marker-end="url(#cpu-arrow)"></path><path d="M540 112H570" marker-end="url(#cpu-arrow)"></path><path d="M648 152V196H100V152" marker-end="url(#cpu-arrow)"></path></g><g><rect x="24" y="72" width="152" height="80" rx="8" fill="#2A7BDB" fill-opacity="0.12" stroke="#2A7BDB" stroke-width="2"></rect><text x="100" y="100" text-anchor="middle" font-weight="600" fill="#1F1E1D">1. Fetch</text><text x="100" y="118" text-anchor="middle" font-size="11.5" fill="#5E5D59">PC가 가리키는</text><text x="100" y="134" text-anchor="middle" font-size="11.5" fill="#5E5D59">명령어를 가져옴</text></g><g><rect x="206" y="72" width="152" height="80" rx="8" fill="#2A7BDB" fill-opacity="0.12" stroke="#2A7BDB" stroke-width="2"></rect><text x="282" y="100" text-anchor="middle" font-weight="600" fill="#1F1E1D">2. Decode</text><text x="282" y="118" text-anchor="middle" font-size="11.5" fill="#5E5D59">제어 장치가</text><text x="282" y="134" text-anchor="middle" font-size="11.5" fill="#5E5D59">명령어를 해석</text></g><g><rect x="388" y="72" width="152" height="80" rx="8" fill="#2A7BDB" fill-opacity="0.12" stroke="#2A7BDB" stroke-width="2"></rect><text x="464" y="100" text-anchor="middle" font-weight="600" fill="#1F1E1D">3. Execute</text><text x="464" y="118" text-anchor="middle" font-size="11.5" fill="#5E5D59">ALU 연산,</text><text x="464" y="134" text-anchor="middle" font-size="11.5" fill="#5E5D59">메모리 접근, 분기</text></g><g><rect x="570" y="72" width="152" height="80" rx="8" fill="#2A7BDB" fill-opacity="0.12" stroke="#2A7BDB" stroke-width="2"></rect><text x="646" y="100" text-anchor="middle" font-weight="600" fill="#1F1E1D">4. Write-back</text><text x="646" y="118" text-anchor="middle" font-size="11.5" fill="#5E5D59">결과를 레지스터/</text><text x="646" y="134" text-anchor="middle" font-size="11.5" fill="#5E5D59">메모리에 기록</text></g><text x="374" y="190" text-anchor="middle" font-size="11.5" fill="#5E5D59">PC가 다음 명령어를 가리키고 반복 (초당 수십억 번)</text><g><rect x="206" y="222" width="336" height="40" rx="8" fill="#F2A60D" fill-opacity="0.12" stroke="#F2A60D" stroke-width="1.25"></rect><text x="374" y="246" text-anchor="middle" font-size="12" fill="#1F1E1D">사이클 끝: 인터럽트가 있으면 핸들러로 전환</text></g></svg>