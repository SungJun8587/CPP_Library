<svg xmlns="http://www.w3.org/2000/svg" width="760" height="224" font-family="Noto Sans CJK KR, sans-serif" viewBox="0 0 760 224" role="img" aria-label="프로그램이 실행되면 프로세스가 되고, 그 안에서 스레드가 실행됩니다" font-size="13"><defs><marker id="intro-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F8D84"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1F1E1D">프로그램이 실행되면 프로세스가 되고, 그 안에서 스레드가 실행됩니다</text><g><rect x="24" y="84" width="168" height="72" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="108" y="108" text-anchor="middle" font-weight="600" fill="#1F1E1D">프로그램</text><text x="108" y="124" text-anchor="middle" font-size="11.5" fill="#5E5D59">디스크의 실행 파일</text><text x="108" y="140" text-anchor="middle" font-size="11.5" fill="#5E5D59">정적인 코드 덩어리</text></g><g><path d="M192 120H264" fill="none" stroke="#8F8D84" stroke-width="1.25" marker-end="url(#intro-arrow)"></path></g><text x="228" y="112" text-anchor="middle" font-size="11.5" fill="#5E5D59">실행</text><g><rect x="264" y="64" width="472" height="108" rx="8" fill="#2A7BDB" fill-opacity="0.12" stroke="#2A7BDB" stroke-width="2"></rect><text x="280" y="86" font-weight="600" fill="#1F1E1D">프로세스</text><text x="280" y="102" font-size="11.5" fill="#5E5D59">메모리에 적재되어 자원을 할당받은 상태</text></g><g><rect x="280" y="116" width="128" height="40" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="344" y="140" text-anchor="middle" fill="#1F1E1D">main 스레드</text></g><g><rect x="436" y="116" width="128" height="40" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="500" y="140" text-anchor="middle" fill="#1F1E1D">스레드 2</text></g><g><rect x="592" y="116" width="128" height="40" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="656" y="140" text-anchor="middle" fill="#1F1E1D">스레드 3</text></g><text x="264" y="196" font-size="11.5" fill="#5E5D59">스레드는 프로세스의 코드, 데이터, 힙을 공유합니다</text></svg>