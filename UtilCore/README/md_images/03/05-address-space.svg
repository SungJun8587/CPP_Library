<svg xmlns="http://www.w3.org/2000/svg" width="760" height="428" font-family="Noto Sans CJK KR, sans-serif" viewBox="0 0 760 428" role="img" aria-label="Stack과 Heap은 서로를 향해 자라고, 나머지 영역은 크기가 고정됩니다" font-size="13"><defs><marker id="mem-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F8D84"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1F1E1D">Stack과 Heap은 서로를 향해 자라고, 나머지 영역은 크기가 고정됩니다</text><text x="24" y="87" font-size="11.5" fill="#5E5D59">높은 주소</text><text x="24" y="363" font-size="11.5" fill="#5E5D59">낮은 주소</text><g><rect x="140" y="64" width="220" height="38" rx="8" fill="#2A7BDB" fill-opacity="0.12" stroke="#2A7BDB" stroke-width="2" stroke-dasharray="none"></rect><text x="200" y="87" text-anchor="middle" font-weight="600" fill="#1F1E1D">Stack</text><text x="330" y="87" text-anchor="middle" font-size="12" fill="#5E5D59">↓ 아래로 성장</text><text x="384" y="87" font-size="11.5" fill="#1F1E1D">지역 변수, 함수 인자, 반환 주소</text></g><g><rect x="140" y="110" width="220" height="38" rx="8" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="250" y="133" text-anchor="middle" fill="#5E5D59">빈 공간</text><text x="384" y="133" font-size="11.5" fill="#5E5D59">Stack과 Heap이 서로를 향해 자라는 여유 공간</text></g><g><rect x="140" y="156" width="220" height="38" rx="8" fill="#2A7BDB" fill-opacity="0.12" stroke="#2A7BDB" stroke-width="2" stroke-dasharray="none"></rect><text x="200" y="179" text-anchor="middle" font-weight="600" fill="#1F1E1D">Heap</text><text x="330" y="179" text-anchor="middle" font-size="12" fill="#5E5D59">↑ 위로 성장</text><text x="384" y="179" font-size="11.5" fill="#1F1E1D">malloc / new로 동적 할당, 개발자가 관리</text></g><g><rect x="140" y="202" width="220" height="38" rx="8" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25" stroke-dasharray="none"></rect><text x="250" y="225" text-anchor="middle" font-weight="600" fill="#1F1E1D">.bss</text><text x="384" y="225" font-size="11.5" fill="#1F1E1D">초기값 없는 전역/static 변수, 0으로 채워짐</text></g><g><rect x="140" y="248" width="220" height="38" rx="8" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25" stroke-dasharray="none"></rect><text x="250" y="271" text-anchor="middle" font-weight="600" fill="#1F1E1D">.data</text><text x="384" y="271" font-size="11.5" fill="#1F1E1D">초기값 있는 전역/static 변수</text></g><g><rect x="140" y="294" width="220" height="38" rx="8" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25" stroke-dasharray="none"></rect><text x="250" y="317" text-anchor="middle" font-weight="600" fill="#1F1E1D">.rodata</text><text x="384" y="317" font-size="11.5" fill="#1F1E1D">const 상수, 문자열 리터럴 (읽기 전용)</text></g><g><rect x="140" y="340" width="220" height="38" rx="8" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25" stroke-dasharray="none"></rect><text x="250" y="363" text-anchor="middle" font-weight="600" fill="#1F1E1D">Code (.text)</text><text x="384" y="363" font-size="11.5" fill="#1F1E1D">기계어 명령 (읽기/실행 전용)</text></g><g><rect x="140" y="394" width="12" height="12" rx="3" fill="#2A7BDB" fill-opacity="0.12" stroke="#2A7BDB" stroke-width="1.25"></rect><text x="160" y="405" font-size="11.5" fill="#5E5D59">색이 있는 영역은 실행 중에 크기가 변합니다</text></g></svg>