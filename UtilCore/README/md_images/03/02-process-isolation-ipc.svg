<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" font-family="Noto Sans CJK KR, sans-serif" viewBox="0 0 760 340" role="img" aria-label="프로세스는 주소 공간이 격리되어 IPC로만 데이터를 주고받습니다" font-size="13"><defs><marker id="iso-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F8D84"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1F1E1D">프로세스는 주소 공간이 격리되어 IPC로만 데이터를 주고받습니다</text><g><rect x="24" y="56" width="300" height="160" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="40" y="78" font-weight="600" fill="#1F1E1D">프로세스 A</text><rect x="40" y="92" width="268" height="56" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="56" y="116" font-weight="600" fill="#1F1E1D">독립된 가상 주소 공간</text><text x="56" y="132" font-size="11.5" fill="#5E5D59">Code, Data, Heap, Stack</text><rect x="40" y="160" width="268" height="40" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="56" y="184" font-weight="600" fill="#1F1E1D">핸들/FD 테이블</text></g><g><rect x="436" y="56" width="300" height="160" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="452" y="78" font-weight="600" fill="#1F1E1D">프로세스 B</text><rect x="452" y="92" width="268" height="56" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="468" y="116" font-weight="600" fill="#1F1E1D">독립된 가상 주소 공간</text><text x="468" y="132" font-size="11.5" fill="#5E5D59">Code, Data, Heap, Stack</text><rect x="452" y="160" width="268" height="40" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="468" y="184" font-weight="600" fill="#1F1E1D">핸들/FD 테이블</text></g><g><path d="M380 84V216" fill="none" stroke="#8F8D84" stroke-width="1.25" stroke-dasharray="4 4"></path></g><text x="380" y="72" text-anchor="middle" font-size="11.5" fill="#5E5D59">직접 접근 불가</text><g fill="none" stroke="#8F8D84" stroke-width=