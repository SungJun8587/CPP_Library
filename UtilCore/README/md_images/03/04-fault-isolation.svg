<svg xmlns="http://www.w3.org/2000/svg" width="760" height="292" font-family="Noto Sans CJK KR, sans-serif" viewBox="0 0 760 292" role="img" aria-label="프로세스는 장애가 격리되고 스레드의 치명적 오류는 프로세스 전체를 종료시킵니다" font-size="13"><text x="24" y="32" font-size="15" font-weight="600" fill="#1F1E1D">프로세스는 장애가 격리되고, 스레드의 치명적 오류는 프로세스 전체를 종료시킵니다</text><text x="24" y="70" font-weight="600" fill="#1F1E1D">프로세스 간: 장애 격리가 강함</text><text x="412" y="70" font-weight="600" fill="#1F1E1D">스레드 간: 장애 격리가 없음</text><g><rect x="40" y="88" width="308" height="56" rx="8" fill="#D93838" fill-opacity="0.12" stroke="#D93838" stroke-width="2"></rect><text x="56" y="112" font-weight="600" fill="#1F1E1D">프로세스 A</text><text x="56" y="128" font-size="11.5" fill="#1F1E1D">치명적 오류로 크래시</text></g><g><rect x="40" y="184" width="308" height="56" rx="8" fill="#14A01A" fill-opacity="0.12" stroke="#14A01A" stroke-width="2"></rect><text x="56" y="208" font-weight="600" fill="#1F1E1D">프로세스 B</text><text x="56" y="224" font-size="11.5" fill="#1F1E1D">영향받지 않고 계속 실행</text></g><g><rect x="412" y="88" width="324" height="152" rx="8" fill="none" stroke="#D93838" stroke-width="2"></rect><text x="428" y="110" font-weight="600" fill="#1F1E1D">프로세스 (전체 종료)</text></g><g><rect x="428" y="124" width="292" height="28" rx="6" fill="#D93838" fill-opacity="0.12" stroke="#D93838" stroke-width="1.25"></rect><text x="444" y="143" fill="#1F1E1D">스레드 1 · 치명적 오류</text></g><g><rect x="428" y="160" width="292" height="28" rx="6" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25"></rect><text x="444" y="179" fill="#1F1E1D">스레드 2 · 함께 종료</text></g><g><rect x="428" y="196" width="292" height="28" rx="6" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25"></rect><text x="444" y="215" fill="#1F1E1D">스레드 3 · 함께 종료</text></g><text x="24" y="268" font-size="11.5" fill="#5E5D59">한 프로세스가 크래시해도 다른 프로세스는 영향받지 않습니다</text><text x="412" y="268" font-size="11.5" fill="#5E5D59">한 스레드의 치명적 오류는 프로세스 전체를 종료시킵니다</text></svg>