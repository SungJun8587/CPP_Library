<svg xmlns="http://www.w3.org/2000/svg" width="760" height="292" font-family="Noto Sans CJK KR, sans-serif" viewBox="0 0 760 292" role="img" aria-label="두 스레드가 같은 값을 읽으면 증가 한 번이 사라집니다" font-size="13"><defs><marker id="race-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F8D84"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1F1E1D">두 스레드가 같은 값을 읽으면 증가 한 번이 사라집니다</text><g><text x="24" y="92" font-size="11.5" fill="#5E5D59">스레드 1</text><rect x="120" y="72" width="124" height="32" rx="8" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25"></rect><text x="182" y="93" text-anchor="middle" fill="#1F1E1D">load</text><rect x="260" y="72" width="124" height="32" rx="8" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25"></rect><text x="322" y="93" text-anchor="middle" fill="#1F1E1D">add</text><rect x="400" y="72" width="124" height="32" rx="8" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25"></rect><text x="462" y="93" text-anchor="middle" fill="#1F1E1D">store</text></g><g><text x="24" y="136" font-size="11.5" fill="#5E5D59">스레드 2</text><rect x="260" y="116" width="124" height="32" rx="8" fill="#D93838" fill-opacity="0.12" stroke="#D93838" stroke-width="1.25"></rect><text x="322" y="137" text-anchor="middle" fill="#1F1E1D">load</text><rect x="400" y="116" width="124" height="32" rx="8" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25"></rect><text x="462" y="137" text-anchor="middle" fill="#1F1E1D">add</text><rect x="540" y="116" width="124" height="32" rx="8" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25"></rect><text x="602" y="137" text-anchor="middle" fill="#1F1E1D">store</text></g><text x="322" y="166" text-anchor="middle" font-size="11.5" fill="#1F1E1D">스레드 1이 저장하기 전의 값을 읽음</text><g><text x="24" y="212" font-size="11.5" fill="#5E5D59">counter 값</text><rect x="120" y="192" width="124" height="32" rx="8" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25"></rect><text x="182" y="213" text-anchor="middle" fill="#1F1E1D">N</text><rect x="260" y="192" width="124" height="32" rx="8" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25"></rect><text x="322" y="213" text-anchor="middle" fill="#1F1E1D">N</text><rect x="400" y="192" width="124" height="32" rx="8" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25"></rect><text x="462" y="213" text-anchor="middle" fill="#1F1E1D">N+1</text><rect x="540" y="192" width="124" height="32" rx="8" fill="#D93838" fill-opacity="0.12" stroke="#D93838" stroke-width="1.25"></rect><text x="602" y="213" text-anchor="middle" fill="#1F1E1D">N+1</text></g><text x="602" y="246" text-anchor="middle" font-size="11.5" fill="#1F1E1D">기대값은 N+2인데 N+1이 남습니다</text><g><path d="M120 268H670" fill="none" stroke="#8F8D84" stroke-width="1.25" marker-end="url(#race-arrow)"></path></g><text x="700" y="272" font-size="11.5" fill="#5E5D59">시간</text></svg>