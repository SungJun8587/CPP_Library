<svg xmlns="http://www.w3.org/2000/svg" width="760" height="308" font-family="Noto Sans CJK KR, sans-serif" viewBox="0 0 760 308" role="img" aria-label="같은 캐시 라인의 변수를 쓰면 코어끼리 라인을 주고받습니다" font-size="13"><defs><marker id="fs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F8D84"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1F1E1D">같은 캐시 라인의 변수를 쓰면 코어끼리 라인을 주고받습니다</text><g><rect x="104" y="64" width="552" height="84" rx="8" fill="#2A7BDB" fill-opacity="0.12" stroke="#2A7BDB" stroke-width="2"></rect><text x="120" y="86" font-weight="600" fill="#1F1E1D">캐시 라인 (통상 64B)</text><rect x="120" y="100" width="200" height="32" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="220" y="121" text-anchor="middle" fill="#1F1E1D">변수 X</text><rect x="440" y="100" width="200" height="32" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="540" y="121" text-anchor="middle" fill="#1F1E1D">변수 Y</text></g><g fill="none" stroke="#8F8D84" stroke-width="1.25"><path d="M220 196V132" marker-end="url(#fs-arrow)"></path><path d="M540 196V132" marker-end="url(#fs-arrow)"></path></g><g><rect x="140" y="196" width="160" height="56" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="220" y="220" text-anchor="middle" font-weight="600" fill="#1F1E1D">코어 1</text><text x="220" y="236" text-anchor="middle" font-size="11.5" fill="#5E5D59">변수 X에 쓰기</text></g><g><rect x="460" y="196" width="160" height="56" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="540" y="220" text-anchor="middle" font-weight="600" fill="#1F1E1D">코어 2</text><text x="540" y="236" text-anchor="middle" font-size="11.5" fill="#5E5D59">변수 Y에 쓰기</text></g><g><path d="M308 224H452" fill="none" stroke="#8F8D84" stroke-width="1.25" marker-start="url(#fs-arrow)" marker-end="url(#fs-arrow)"></path></g><text x="380" y="216" text-anchor="middle" font-size="11.5" fill="#5E5D59">라인을 주고받음</text><text x="380" y="244" text-anchor="middle" font-size="11.5" fill="#5E5D59">쓸 때마다 무효화</text><text x="24" y="284" font-size="11.5" fill="#1F1E1D">해결: alignas(64) 패딩으로 변수를 서로 다른 캐시 라인에 둡니다</text></svg>