<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" font-family="Noto Sans CJK KR, sans-serif" viewBox="0 0 760 280" role="img" aria-label="병렬성은 코어를 나눠 동시에, 동시성은 한 코어를 번갈아 씁니다" font-size="13"><defs><marker id="conc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F8D84"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1F1E1D">병렬성은 코어를 나눠 동시에, 동시성은 한 코어를 번갈아 씁니다</text><text x="24" y="62" font-weight="600" fill="#1F1E1D">병렬성 · 코어가 여러 개라 두 작업이 실제로 동시에 실행됩니다</text><g><text x="24" y="92" font-size="11.5" fill="#5E5D59">코어 1</text><rect x="100" y="74" width="600" height="28" rx="6" fill="#2A7BDB" fill-opacity="0.18" stroke="#2A7BDB" stroke-width="1.25"></rect><text x="400" y="93" text-anchor="middle" fill="#1F1E1D">작업 A</text><text x="24" y="128" font-size="11.5" fill="#5E5D59">코어 2</text><rect x="100" y="110" width="600" height="28" rx="6" fill="#E8693A" fill-opacity="0.18" stroke="#E8693A" stroke-width="1.25"></rect><text x="400" y="129" text-anchor="middle" fill="#1F1E1D">작업 B</text></g><text x="24" y="182" font-weight="600" fill="#1F1E1D">동시성 · 코어 하나를 번갈아 쓰며 동시에 진행되는 것처럼 보입니다</text><g><text x="24" y="212" font-size="11.5" fill="#5E5D59">코어 1</text><rect x="100" y="194" width="100" height="28" rx="6" fill="#2A7BDB" fill-opacity="0.18" stroke="#2A7BDB" stroke-width="1.25"></rect><text x="150" y="213" text-anchor="middle" fill="#1F1E1D">A</text><rect x="200" y="194" width="100" height="28" rx="6" fill="#E8693A" fill-opacity="0.18" stroke="#E8693A" stroke-width="1.25"></rect><text x="250" y="213" text-anchor="middle" fill="#1F1E1D">B</text><rect x="300" y="194" width="100" height="28" rx="6" fill="#2A7BDB" fill-opacity="0.18" stroke="#2A7BDB" stroke-width="1.25"></rect><text x="350" y="213" text-anchor="middle" fill="#1F1E1D">A</text><rect x="400" y="194" width="100" height="28" rx="6" fill="#E8693A" fill-opacity="0.18" stroke="#E8693A" stroke-width="1.25"></rect><text x="450" y="213" text-anchor="middle" fill="#1F1E1D">B</text><rect x="500" y="194" width="100" height="28" rx="6" fill="#2A7BDB" fill-opacity="0.18" stroke="#2A7BDB" stroke-width="1.25"></rect><text x="550" y="213" text-anchor="middle" fill="#1F1E1D">A</text><rect x="600" y="194" width="100" height="28" rx="6" fill="#E8693A" fill-opacity="0.18" stroke="#E8693A" stroke-width="1.25"></rect><text x="650" y="213" text-anchor="middle" fill="#1F1E1D">B</text></g><text x="400" y="242" text-anchor="middle" font-size="11.5" fill="#5E5D59">작업을 잘게 나눠 번갈아 실행합니다 (컨텍스트 스위칭)</text><g><path d="M100 256H700" fill="none" stroke="#8F8D84" stroke-width="1.25" marker-end="url(#conc-arrow)"></path></g><text x="708" y="260" font-size="11.5" fill="#5E5D59">시간</text></svg>