<svg xmlns="http://www.w3.org/2000/svg" width="760" height="312" font-family="Noto Sans CJK KR, sans-serif" viewBox="0 0 760 312" role="img" aria-label="스레드는 위쪽 영역을 공유하고, 스택과 레지스터만 따로 가집니다" font-size="13"><defs><marker id="share-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F8D84"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1F1E1D">스레드는 위쪽 영역을 공유하고, 스택과 레지스터만 따로 가집니다</text><g><rect x="24" y="56" width="712" height="232" rx="8" fill="none" stroke="#E6E4DC" stroke-width="1.25"></rect><text x="40" y="78" font-weight="600" fill="#1F1E1D">프로세스</text></g><g><rect x="40" y="96" width="680" height="56" rx="8" fill="#2A7BDB" fill-opacity="0.12" stroke="#2A7BDB" stroke-width="2"></rect><text x="380" y="120" text-anchor="middle" font-weight="600" fill="#1F1E1D">모든 스레드가 공유</text><text x="380" y="136" text-anchor="middle" font-size="11.5" fill="#1F1E1D">Code, Data, Heap, 핸들/FD 테이블, 주소 공간</text></g><g fill="none" stroke="#8F8D84" stroke-width="1.25"><path d="M144 184V152" marker-end="url(#share-arrow)"></path><path d="M380 184V152" marker-end="url(#share-arrow)"></path><path d="M616 184V152" marker-end="url(#share-arrow)"></path></g><text x="392" y="172" font-size="11.5" fill="#5E5D59">같은 자원을 사용</text><g><rect x="40" y="184" width="208" height="88" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="144" y="208" text-anchor="middle" font-weight="600" fill="#1F1E1D">스레드 1</text><text x="144" y="224" text-anchor="middle" font-size="11.5" fill="#1F1E1D">독립된 스택</text><text x="144" y="240" text-anchor="middle" font-size="11.5" fill="#1F1E1D">레지스터 (PC, SP 포함)</text><text x="144" y="256" text-anchor="middle" font-size="11.5" fill="#1F1E1D">TLS, 스레드 ID</text></g><g><rect x="276" y="184" width="208" height="88" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="380" y="208" text-anchor="middle" font-weight="600" fill="#1F1E1D">스레드 2</text><text x="380" y="224" text-anchor="middle" font-size="11.5" fill="#1F1E1D">독립된 스택</text><text x="380" y="240" text-anchor="middle" font-size="11.5" fill="#1F1E1D">레지스터 (PC, SP 포함)</text><text x="380" y="256" text-anchor="middle" font-size="11.5" fill="#1F1E1D">TLS, 스레드 ID</text></g><g><rect x="512" y="184" width="208" height="88" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="616" y="208" text-anchor="middle" font-weight="600" fill="#1F1E1D">스레드 3</text><text x="616" y="224" text-anchor="middle" font-size="11.5" fill="#1F1E1D">독립된 스택</text><text x="616" y="240" text-anchor="middle" font-size="11.5" fill="#1F1E1D">레지스터 (PC, SP 포함)</text><text x="616" y="256" text-anchor="middle" font-size="11.5" fill="#1F1E1D">TLS, 스레드 ID</text></g></svg>