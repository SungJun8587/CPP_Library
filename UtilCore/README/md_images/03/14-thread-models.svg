<svg xmlns="http://www.w3.org/2000/svg" width="760" height="332" font-family="Noto Sans CJK KR, sans-serif" viewBox="0 0 760 332" role="img" aria-label="주요 OS는 사용자 스레드 1개가 커널 스레드 1개에 대응하는 1:1 모델입니다" font-size="13"><text x="24" y="32" font-size="15" font-weight="600" fill="#1F1E1D">주요 OS는 사용자 스레드 1개가 커널 스레드 1개에 대응하는 1:1 모델입니다</text><g><rect x="24" y="54" width="224" height="230" rx="8" fill="#2A7BDB" fill-opacity="0.12" stroke="#2A7BDB" stroke-width="2"></rect><text x="40" y="78" font-weight="600" fill="#1F1E1D">1:1 모델</text><text x="40" y="94" font-size="11.5" fill="#5E5D59">Windows, Linux, Java</text><rect x="30" y="112" width="60" height="28" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="60" y="130" text-anchor="middle" font-size="11.5" fill="#1F1E1D">스레드</text><rect x="106" y="112" width="60" height="28" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="136" y="130" text-anchor="middle" font-size="11.5" fill="#1F1E1D">스레드</text><rect x="182" y="112" width="60" height="28" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="212" y="130" text-anchor="middle" font-size="11.5" fill="#1F1E1D">스레드</text><g fill="none" stroke="#8F8D84" stroke-width="1.25"><path d="M60 140V196"></path><path d="M136 140V196"></path><path d="M212 140V196"></path></g><rect x="30" y="196" width="60" height="28" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="60" y="214" text-anchor="middle" font-size="11.5" fill="#1F1E1D">커널</text><rect x="106" y="196" width="60" height="28" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="136" y="214" text-anchor="middle" font-size="11.5" fill="#1F1E1D">커널</text><rect x="182" y="196" width="60" height="28" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="212" y="214" text-anchor="middle" font-size="11.5" fill="#1F1E1D">커널</text><text x="136" y="246" text-anchor="middle" font-size="11.5" fill="#1F1E1D">멀티코어를 활용하고</text><text x="136" y="262" text-anchor="middle" font-size="11.5" fill="#1F1E1D">블로킹이 서로를 막지 않음</text></g><g><rect x="268" y="54" width="224" height="230" rx="8" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25"></rect><text x="284" y="78" font-weight="600" fill="#1F1E1D">N:1 모델</text><text x="284" y="94" font-size="11.5" fill="#5E5D59">초기 green thread</text><rect x="274" y="112" width="60" height="28" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="304" y="130" text-anchor="middle" font-size="11.5" fill="#1F1E1D">스레드</text><rect x="350" y="112" width="60" height="28" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="380" y="130" text-anchor="middle" font-size="11.5" fill="#1F1E1D">스레드</text><rect x="426" y="112" width="60" height="28" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="456" y="130" text-anchor="middle" font-size="11.5" fill="#1F1E1D">스레드</text><g fill="none" stroke="#8F8D84" stroke-width="1.25"><path d="M304 140L380 196"></path><path d="M380 140V196"></path><path d="M456 140L380 196"></path></g><rect x="338" y="196" width="84" height="28" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="380" y="214" text-anchor="middle" font-size="11.5" fill="#1F1E1D">커널 1개</text><text x="380" y="246" text-anchor="middle" font-size="11.5" fill="#1F1E1D">전환은 가볍지만</text><text x="380" y="262" text-anchor="middle" font-size="11.5" fill="#1F1E1D">멀티코어 불가, 블로킹 시 전체 정지</text></g><g><rect x="512" y="54" width="224" height="230" rx="8" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25"></rect><text x="528" y="78" font-weight="600" fill="#1F1E1D">M:N 모델</text><text x="528" y="94" font-size="11.5" fill="#5E5D59">Go goroutine, 코루틴 계열</text><rect x="518" y="112" width="60" height="28" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="548" y="130" text-anchor="middle" font-size="11.5" fill="#1F1E1D">스레드</text><rect x="594" y="112" width="60" height="28" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="624" y="130" text-anchor="middle" font-size="11.5" fill="#1F1E1D">스레드</text><rect x="670" y="112" width="60" height="28" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="700" y="130" text-anchor="middle" font-size="11.5" fill="#1F1E1D">스레드</text><g fill="none" stroke="#8F8D84" stroke-width="1.25"><path d="M548 140L586 196"></path><path d="M624 140L586 196"></path><path d="M624 140L662 196"></path><path d="M700 140L662 196"></path></g><rect x="556" y="196" width="60" height="28" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="586" y="214" text-anchor="middle" font-size="11.5" fill="#1F1E1D">커널</text><rect x="632" y="196" width="60" height="28" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="662" y="214" text-anchor="middle" font-size="11.5" fill="#1F1E1D">커널</text><text x="624" y="246" text-anchor="middle" font-size="11.5" fill="#1F1E1D">가볍고 멀티코어도 활용</text><text x="624" y="262" text-anchor="middle" font-size="11.5" fill="#1F1E1D">런타임이 복잡</text></g><text x="24" y="308" font-size="11.5" fill="#5E5D59">위쪽은 사용자 스레드(태스크), 아래쪽은 커널이 스케줄링하는 커널 스레드입니다</text></svg>