<svg xmlns="http://www.w3.org/2000/svg" width="760" height="232" font-family="Noto Sans CJK KR, sans-serif" viewBox="0 0 760 232" role="img" aria-label="코어를 늘려도 직렬 구간은 줄어들지 않습니다" font-size="13"><text x="24" y="32" font-size="15" font-weight="600" fill="#1F1E1D">코어를 늘려도 직렬 구간은 줄어들지 않습니다</text><g><text x="24" y="89" font-size="11.5" fill="#5E5D59">코어 1개</text><rect x="130" y="68" width="80" height="32" rx="6" fill="#2A7BDB" fill-opacity="0.12" stroke="#2A7BDB" stroke-width="2"></rect><text x="170" y="89" text-anchor="middle" font-weight="600" fill="#1F1E1D">직렬</text><rect x="210" y="68" width="400" height="32" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="410" y="89" text-anchor="middle" fill="#1F1E1D">병렬 구간</text></g><g><text x="24" y="145" font-size="11.5" fill="#5E5D59">코어 여러 개</text><rect x="130" y="124" width="80" height="32" rx="6" fill="#2A7BDB" fill-opacity="0.12" stroke="#2A7BDB" stroke-width="2"></rect><text x="170" y="145" text-anchor="middle" font-weight="600" fill="#1F1E1D">직렬</text><rect x="210" y="124" width="100" height="32" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="260" y="145" text-anchor="middle" fill="#1F1E1D">병렬 구간</text><rect x="310" y="124" width="300" height="32" rx="6" fill="none" stroke="#8F8D84" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="460" y="145" text-anchor="middle" font-size="11.5" fill="#5E5D59">코어를 늘려 줄어든 시간</text></g><text x="24" y="190" font-size="11.5" fill="#1F1E1D">직렬 구간의 비율이 s이면 최대 가속은 1/s를 넘지 못합니다</text><text x="24" y="208" font-size="11.5" fill="#1F1E1D">코어를 늘려도 직렬 구간(락으로 보호되는 구간 등)은 그대로 남습니다</text></svg>