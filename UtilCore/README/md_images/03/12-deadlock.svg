<svg xmlns="http://www.w3.org/2000/svg" width="760" height="264" font-family="Noto Sans CJK KR, sans-serif" viewBox="0 0 760 264" role="img" aria-label="서로 상대가 쥔 락을 기다리면 둘 다 영원히 멈춥니다" font-size="13"><defs><marker id="dead-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F8D84"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1F1E1D">서로 상대가 쥔 락을 기다리면 둘 다 영원히 멈춥니다</text><g fill="none" stroke="#8F8D84" stroke-width="1.25"><path d="M180 94H280" marker-end="url(#dead-arrow)"></path><path d="M350 118V190" marker-end="url(#dead-arrow)"></path><path d="M280 214H180" marker-end="url(#dead-arrow)"></path><path d="M110 190V118" marker-end="url(#dead-arrow)"></path></g><g><rect x="40" y="70" width="140" height="48" rx="8" fill="#2A7BDB" fill-opacity="0.12" stroke="#2A7BDB" stroke-width="2"></rect><text x="110" y="99" text-anchor="middle" font-weight="600" fill="#1F1E1D">스레드 1</text></g><g><rect x="280" y="70" width="140" height="48" rx="8" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25"></rect><text x="350" y="99" text-anchor="middle" font-weight="600" fill="#1F1E1D">락 B</text></g><g><rect x="280" y="190" width="140" height="48" rx="8" fill="#2A7BDB" fill-opacity="0.12" stroke="#2A7BDB" stroke-width="2"></rect><text x="350" y="219" text-anchor="middle" font-weight="600" fill="#1F1E1D">스레드 2</text></g><g><rect x="40" y="190" width="140" height="48" rx="8" fill="none" fill-opacity="1" stroke="#8F8D84" stroke-width="1.25"></rect><text x="110" y="219" text-anchor="middle" font-weight="600" fill="#1F1E1D">락 A</text></g><text x="230" y="86" text-anchor="middle" font-size="11.5" fill="#5E5D59">대기</text><text x="360" y="158" font-size="11.5" fill="#5E5D59">보유</text><text x="230" y="206" text-anchor="middle" font-size="11.5" fill="#5E5D59">대기</text><text x="120" y="158" font-size="11.5" fill="#5E5D59">보유</text><text x="468" y="100" font-size="11.5" fill="#1F1E1D">스레드 1: 락 A를 잡은 채 락 B를 기다림</text><text x="468" y="124" font-size="11.5" fill="#1F1E1D">스레드 2: 락 B를 잡은 채 락 A를 기다림</text><text x="468" y="188" font-weight="600" fill="#1F1E1D">예방</text><text x="468" y="206" font-size="11.5" fill="#1F1E1D">모든 스레드가 같은 순서로 락을 잡으면</text><text x="468" y="222" font-size="11.5" fill="#1F1E1D">순환 대기가 생기지 않습니다</text></svg>