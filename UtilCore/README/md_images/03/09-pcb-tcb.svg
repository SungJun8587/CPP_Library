<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" font-family="Noto Sans CJK KR, sans-serif" viewBox="0 0 760 320" role="img" aria-label="프로세스 하나에 PCB 1개, 그 안의 스레드마다 TCB가 따로 있습니다" font-size="13"><defs><marker id="pcb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F8D84"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1F1E1D">프로세스 하나에 PCB 1개, 그 안의 스레드마다 TCB가 따로 있습니다</text><g><rect x="24" y="100" width="272" height="128" rx="8" fill="#2A7BDB" fill-opacity="0.12" stroke="#2A7BDB" stroke-width="2"></rect><text x="40" y="124" font-weight="600" fill="#1F1E1D">PCB · 프로세스당 1개</text><text x="40" y="140" font-size="11.5" fill="#1F1E1D">PID, 부모 PID, 프로세스 상태</text><text x="40" y="156" font-size="11.5" fill="#1F1E1D">메모리 관리 정보 (페이지 테이블)</text><text x="40" y="172" font-size="11.5" fill="#1F1E1D">열린 파일/핸들 목록</text><text x="40" y="188" font-size="11.5" fill="#1F1E1D">보안 토큰, 환경 변수</text><text x="40" y="204" font-size="11.5" fill="#1F1E1D">스레드 목록 (TCB들)</text></g><g fill="none" stroke="#8F8D84" stroke-width="1.25"><path d="M296 164H392" marker-end="url(#pcb-arrow)"></path><path d="M296 164H344V92H392" marker-end="url(#pcb-arrow)"></path><path d="M296 164H344V236H392" marker-end="url(#pcb-arrow)"></path></g><g><rect x="392" y="64" width="344" height="56" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="408" y="88" font-weight="600" fill="#1F1E1D">TCB · 스레드 1</text><text x="408" y="104" font-size="11.5" fill="#5E5D59">상태, CPU 컨텍스트, 스택, 스케줄링 정보</text></g><g><rect x="392" y="136" width="344" height="56" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="408" y="160" font-weight="600" fill="#1F1E1D">TCB · 스레드 2</text><text x="408" y="176" font-size="11.5" fill="#5E5D59">상태, CPU 컨텍스트, 스택, 스케줄링 정보</text></g><g><rect x="392" y="208" width="344" height="56" rx="8" fill="none" stroke="#8F8D84" stroke-width="1.25"></rect><text x="408" y="232" font-weight="600" fill="#1F1E1D">TCB · 스레드 3</text><text x="408" y="248" font-size="11.5" fill="#5E5D59">상태, CPU 컨텍스트, 스택, 스케줄링 정보</text></g><text x="24" y="296" font-size="11.5" fill="#5E5D59">TCB는 개념상 PCB에 속하지만, 실제 구현은 OS마다 다릅니다</text></svg>